name: Pipeline

# Runs on every push to main, which includes a merged pull request.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The pre-commit hooks: file checks, ruff and mypy, over the whole repository.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # Each project's unit tests, in parallel once lint passes. They need none of the
  # odctl services. Add a project to the matrix when it gets a tests folder.
  unit-test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: air-quality
            python: "3.13"
    name: unit-test (${{ matrix.project }})
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          working-directory: ${{ matrix.project }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/requirements.txt

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -q
