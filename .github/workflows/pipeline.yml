name: Pipeline

# Runs on every push to main, which includes a merged pull request.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The pre-commit hooks: file checks, ruff and mypy, over the whole repository.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # Each project's unit tests, in parallel once lint passes. They need none of the
  # odctl services. Add a project to the matrix when it gets a tests folder.
  unit-test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: air-quality
            python: "3.13"
          - project: ecommerce-cdc
            python: "3.13"
          - project: game-leaderboard
            python: "3.13"
          - project: live-dashboard
            python: "3.13"
          - project: product-recommender
            python: "3.11"  # its pins need pandas 1.x, which has no wheels after 3.11
    name: unit-test (${{ matrix.project }})
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          working-directory: ${{ matrix.project }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/requirements.txt

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -q

  # The Next.js dashboard's unit tests and type check, in parallel once lint passes.
  node-test:
    needs: lint
    runs-on: ubuntu-latest
    name: node-test (live-dashboard/nextjs)
    defaults:
      run:
        working-directory: live-dashboard/nextjs
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.20.0

      - name: Install Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: live-dashboard/nextjs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Check types
        run: pnpm exec tsc --noEmit

  # Each JVM build's unit tests, in parallel once lint passes.
  jvm-test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: product-recommender/recsys-trainer
            tasks: test
          - build: order-streams
            tasks: test ktlintCheck
    name: jvm-test (${{ matrix.build }})
    defaults:
      run:
        working-directory: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Run unit tests
        run: ./gradlew ${{ matrix.tasks }}
