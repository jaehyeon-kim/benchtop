name: Pipeline

# Runs on every push to main, which includes a merged pull request.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The pre-commit hooks: file checks, ruff and mypy, over the whole repository.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # The air-quality unit tests. They need none of the odctl services.
  air-quality-unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air-quality
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true
          working-directory: air-quality
          enable-cache: true
          cache-dependency-glob: air-quality/requirements.txt

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -q
